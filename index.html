.kcard.lost{border-left:3px solid #ef4444;background:#ffffff}

function tashNow(){
  const t=new Date(new Date().getTime()+5*3600000);
  return `${t.getUTCDate().toString().padStart(2,'0')}.${(t.getUTCMonth()+1).toString().padStart(2,'0')}.${t.getUTCFullYear()} ${t.getUTCHours().toString().padStart(2,'0')}:${t.getUTCMinutes().toString().padStart(2,'0')}`;
}
function tashDay(){
  const days=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const t=new Date(new Date().getTime()+5*3600000);
  return{day:days[t.getUTCDay()],hour:t.getUTCHours(),date:tashNow()};
}

function fmtDate(v){
  if(!v)return'';
  if(typeof v==='string'&&v.includes('T')){
    const t=new Date(new Date(v).getTime()+5*3600000);
    return `${t.getUTCDate().toString().padStart(2,'0')}.${(t.getUTCMonth()+1).toString().padStart(2,'0')}.${t.getUTCFullYear()} ${t.getUTCHours().toString().padStart(2,'0')}:${t.getUTCMinutes().toString().padStart(2,'0')}`;
  }
  return v;
}
function parseComments(raw){
  if(!raw)return[];
  try{const p=JSON.parse(raw);return Array.isArray(p)?p:[];}
  catch{if(typeof raw==='string'&&raw.trim())return[{id:uid(),text:raw,time:tashNow()}];return[];}
}
function groupByDay(comments){
  const g={};
  comments.forEach(c=>{const d=c.time?c.time.split(' ')[0]:'—';if(!g[d])g[d]=[];g[d].push(c);});
  return g;
}

function PipelinePage({onSendToKanban}){
  const [leads,setLeads]=useState(()=>ls(SC)||[]);
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState('');
  const [selected,setSelected]=useState(null);
  const [search,setSearch]=useState('');
  const [tier,setTier]=useState('ALL');

  async function load(){
    setLoading(true);setMsg('Загружаю...');
    try{
      const rows=await apiGet('All Leads');
      if(!rows||rows.length<2){setMsg('Пусто');setLoading(false);return;}
      const mapped=rows.slice(1).filter(r=>r[0]||r[1]).map(r=>({
        id:uid(),username:r[0]||'',businessName:r[1]||'',category:r[2]||'',
        followers:r[3]||'',postsPerWeek:r[4]||'',website:r[5]||'',phone:r[6]||'',
        email:r[7]||'',bio:r[8]||'',language:r[9]||'',hasAutoReply:r[10]||'',
        profileUrl:r[11]||'',tier:r[12]||'',firstMessage:r[13]||'',addedAt:r[14]||''
      }));
      setLeads(mapped);lss(SC,mapped);setMsg(`✅ ${mapped.length} лидов`);
    }catch(e){setMsg('Ошибка: '+e.message);}
    setLoading(false);setTimeout(()=>setMsg(''),4000);
  }

  useEffect(()=>{load();},[]);

  const filtered=useMemo(()=>leads.filter(l=>{
    const q=search.toLowerCase();
    return(!q||(l.businessName+l.username+l.category).toLowerCase().includes(q))&&(tier==='ALL'||l.tier===tier);
  }),[leads,search,tier]);

  const counts=useMemo(()=>{
    const c={ALL:leads.length,IDEAL:0,POTENTIAL:0};
    leads.forEach(l=>{if(c[l.tier]!==undefined)c[l.tier]++;});
    return c;
  },[leads]);

  return(
    <div style={{animation:'fadeUp 0.2s ease'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20,flexWrap:'wrap',gap:12}}>
        <div>
          <h1 style={{fontSize:18,fontWeight:700,color:'#e8e8f4',marginBottom:4}}>Pipeline</h1>
          <p style={{fontSize:13,color:'rgba(255,255,255,0.3)'}}>{leads.length} лидов от AI-агента</p>
        </div>
        <button className="btn btn-navy" onClick={load} disabled={loading}>
          <span style={{animation:loading?'spin 1s linear infinite':'none',display:'inline-block'}}><I.refresh/></span>
          {loading?'Загружаю...':'Обновить'}
        </button>
      </div>
      {msg&&<div style={{fontSize:12,color:msg.startsWith('✅')?'var(--green)':'var(--red)',marginBottom:10,fontFamily:'JetBrains Mono,monospace',padding:'8px 12px',background:msg.startsWith('✅')?'#f0fdf8':'#fff5f5',borderRadius:8,border:`1px solid ${msg.startsWith('✅')?'#6ee7b7':'#fca5a5'}`}}>{msg}</div>}
      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск..." style={{flex:1,minWidth:180,padding:'9px 13px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:8,color:'#e8e8f4',fontSize:13}}/>
        {['ALL','IDEAL','POTENTIAL'].map(t=>(
          <button key={t} onClick={()=>setTier(t)} style={{padding:'9px 15px',background:tier===t?'#6366f1':'rgba(255,255,255,0.05)',border:`1.5px solid ${tier===t?'var(--navy)':'var(--border)'}`,borderRadius:10,color:tier===t?'#fff':'rgba(255,255,255,0.5)',fontSize:12,fontWeight:600,display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}>
            {t==='ALL'?'Все':t}<span style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,opacity:0.6}}>{counts[t]||0}</span>
          </button>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(268px,1fr))',gap:12}}>
        {filtered.map(l=><div key={l.id}><PipelineCard lead={l} onClick={()=>setSelected(l)}/></div>)}

По-русски. Максимум 500 слов.`;

function ContentPage(){
  const [done,setDone]=useState(()=>new Set(ls(SCONT)||['c1']));
  const [filter,setFilter]=useState('all');
  const [search,setSearch]=useState('');
  function toggle(id){
    setDone(prev=>{
      const next=new Set(prev);
      const wasDone=next.has(id);
      wasDone?next.delete(id):next.add(id);
      lss(SCONT,[...next]);
      const item=CONTENT_ITEMS.find(i=>i.id===id);
      if(item)apiPost({action:'updateContentStatus',n:item.n,done:!wasDone}).catch(()=>{});
      return next;
    });
  }
  function itemStatus(item){
    if(done.has(item.id))return'done';
    const [d,m,y]=item.date.split('.').map(Number);
    const itemDate=new Date(y,m-1,d);
    const now=new Date(new Date().getTime()+5*3600000);
    const todayDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if(itemDate.getTime()===todayDate.getTime())return'today';
    if(itemDate<todayDate)return'missed';
    return'upcoming';
  }
  const doneCount=[...done].filter(id=>CONTENT_ITEMS.find(i=>i.id===id)).length;
  const total=CONTENT_ITEMS.length;
  const pct=Math.round(doneCount/total*100);
  const catStats=Object.fromEntries(Object.keys(CAT_C).map(cat=>[cat,{total:CONTENT_ITEMS.filter(i=>i.cat===cat).length,done:CONTENT_ITEMS.filter(i=>i.cat===cat&&done.has(i.id)).length}]));
  const filtered=CONTENT_ITEMS.filter(it=>{
    const q=search.toLowerCase();
    const matchQ=!q||it.topic.toLowerCase().includes(q)||it.cat.toLowerCase().includes(q)||it.kun.toLowerCase().includes(q);
    const st=itemStatus(it);
    const matchF=filter==='all'||(filter==='done'&&st==='done')||(filter==='today'&&st==='today')||(filter==='missed'&&st==='missed')||(filter==='upcoming'&&st==='upcoming');
    return matchQ&&matchF;
  });
  return(
    <div style={{animation:'fadeUp 0.2s ease'}}>
      <div style={{marginBottom:20}}>
        <h1 style={{fontSize:18,fontWeight:700,color:'#e8e8f4',marginBottom:4}}>Контент-план</h1>
        <p style={{fontSize:13,color:'rgba(255,255,255,0.3)'}}>90 дней · 0→10к$ · Серия 2026</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 80px',gap:10,marginBottom:16}}>
        <div style={{background:'#12131f',border:'1px solid rgba(255,255,255,0.08)',borderRadius:12,padding:'14px 18px'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
            <span style={{fontSize:13,fontWeight:600,color:'#e8e8f4'}}>{doneCount} / {total} выпусков</span>
            <span style={{fontSize:14,fontWeight:800,color:'#4ade80'}}>{pct}%</span>
          </div>
          <div style={{height:6,background:'rgba(255,255,255,0.08)',borderRadius:3,overflow:'hidden',marginBottom:10}}>
            <div style={{height:'100%',width:`${pct}%`,background:'linear-gradient(90deg,#6366f1,#a855f7,#4ade80)',borderRadius:3,transition:'width 0.5s ease'}}/>
          </div>
          <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
            {Object.entries(catStats).map(([cat,{total:t,done:d}])=>(
              <div key={cat} style={{display:'flex',alignItems:'center',gap:5}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:CAT_C[cat].c,display:'inline-block'}}/>
                <span style={{fontSize:10,color:'rgba(255,255,255,0.35)'}}>{cat} {d}/{t}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{background:'#12131f',border:'1px solid rgba(255,255,255,0.08)',borderRadius:12,padding:'14px',textAlign:'center',display:'flex',flexDirection:'column',justifyContent:'center'}}>
          <div style={{fontSize:26,fontWeight:800,color:'#fb923c',lineHeight:1}}>{total-doneCount}</div>
          <div style={{fontSize:10,color:'rgba(255,255,255,0.3)',marginTop:4}}>впереди</div>
        </div>
      </div>
      <div style={{display:'flex',gap:7,marginBottom:14,flexWrap:'wrap'}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск темы..." style={{flex:1,minWidth:150,padding:'8px 12px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.09)',borderRadius:8,color:'#e8e8f4',fontSize:12}}/>
        {[['all','Все'],['today','Сегодня'],['upcoming','Впереди'],['missed','Пропущено'],['done','Готово']].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{padding:'7px 11px',background:filter===v?'#6366f1':'rgba(255,255,255,0.04)',border:`1.5px solid ${filter===v?'transparent':'rgba(255,255,255,0.08)'}`,borderRadius:8,color:filter===v?'#fff':'rgba(255,255,255,0.4)',fontSize:11,fontWeight:600,cursor:'pointer',transition:'all 0.15s'}}>{l}</button>
        ))}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:5}}>
        {filtered.map(item=>{
          const st=itemStatus(item);const cc=CAT_C[item.cat]||{c:'#9ca3af',bg:'rgba(156,163,175,0.1)'};const isDone=done.has(item.id);
          return(
            <div key={item.id} style={{background:st==='today'?'#eef2ff':'#ffffff',border:`1px solid ${st==='today'?'rgba(99,102,241,0.25)':isDone?'rgba(74,222,128,0.35)':st==='missed'&&!isDone?'rgba(239,68,68,0.2)':'rgba(0,0,0,0.07)'}`,borderRadius:10,padding:'11px 14px',display:'flex',alignItems:'center',gap:12,transition:'all 0.15s',opacity:isDone?0.7:1,boxShadow:'0 1px 3px rgba(0,0,0,0.07)'}}>
              <div style={{width:34,height:34,borderRadius:8,background:'rgba(0,0,0,0.04)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flexShrink:0,border:'1px solid rgba(0,0,0,0.08)'}}>
                <div style={{fontSize:9,color:'rgba(0,0,0,0.4)',lineHeight:1}}>{item.date.slice(0,5)}</div>
                <div style={{fontSize:11,fontWeight:800,color:st==='today'?'#6366f1':isDone?'#16a34a':'rgba(0,0,0,0.5)',lineHeight:1.3}}>#{item.n}</div>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4,flexWrap:'wrap'}}>
                  <span style={{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:20,color:cc.c,background:cc.bg,letterSpacing:'0.05em',textTransform:'uppercase'}}>{item.cat}</span>
                  <span style={{fontSize:9,color:'rgba(0,0,0,0.35)'}}>{item.kun}</span>
                  {st==='today'&&<span style={{fontSize:9,fontWeight:700,color:'#6366f1',background:'rgba(99,102,241,0.1)',padding:'2px 7px',borderRadius:20}}>СЕГОДНЯ</span>}
                  {st==='missed'&&!isDone&&<span style={{fontSize:9,fontWeight:700,color:'#ef4444',background:'rgba(239,68,68,0.1)',padding:'2px 7px',borderRadius:20}}>ПРОПУЩЕНО</span>}
                </div>
                <div style={{fontSize:13,fontWeight:isDone?400:500,color:isDone?'rgba(0,0,0,0.3)':'#1a1b2e',textDecoration:isDone?'line-through':'none',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.topic}</div>
              </div>
              <button onClick={()=>toggle(item.id)} title={isDone?'Снять отметку':'Отметить готово'} style={{width:32,height:32,borderRadius:9,border:`1.5px solid ${isDone?'rgba(74,222,128,0.6)':'rgba(0,0,0,0.15)'}`,background:isDone?'rgba(74,222,128,0.1)':'transparent',color:isDone?'#16a34a':'rgba(0,0,0,0.3)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0,transition:'all 0.15s',fontSize:15}}>
                {isDone?<I.check/>:'○'}
              </button>
            </div>
          );
        })}
        {filtered.length===0&&<div style={{textAlign:'center',padding:'3rem',color:'rgba(255,255,255,0.2)',fontSize:13,background:'rgba(255,255,255,0.02)',borderRadius:12,border:'1px dashed rgba(255,255,255,0.07)'}}>Ничего не найдено</div>}
      </div>
    </div>
  );
}

function PlannerPage(){
  const [tasks,setTasks]=useState(()=>ls(SP)||[]);
  const [selDate,setSelDate]=useState(()=>todayStr());
  const [newText,setNewText]=useState('');
  const [newPrio,setNewPrio]=useState('medium');
  const [newNote,setNewNote]=useState('');
  const [showForm,setShowForm]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [syncMsg,setSyncMsg]=useState('');

  function save(next){setTasks(next);lss(SP,next);}

  useEffect(()=>{
    fetch(`${API}?action=getPlanner`)
      .then(r=>r.json())
      .then(data=>{
        if(Array.isArray(data)&&data.length>0){
          const local=ls(SP)||[];
          const localIds=new Set(local.map(t=>t.id));
          const remote=data.filter(t=>!localIds.has(t.id));
          const merged=[...local,...remote];
          save(merged);
        }
      }).catch(()=>{});
  },[]);

  async function syncToSheets(){
    setSyncing(true);setSyncMsg('Синхронизирую...');
    try{
      const remote=await fetch(`${API}?action=getPlanner`).then(r=>r.json());
      const remoteIds=new Set(Array.isArray(remote)?remote.map(t=>t.id):[]);
      const local=ls(SP)||[];
      let added=0;
      for(const t of local){
        if(!remoteIds.has(t.id)){
          await apiPost({action:'addPlanner',id:t.id,date:t.date,text:t.text,comment:t.comment||'',createdAt:t.createdAt||''});
          added++;
        }
      }
      for(const t of local){
        if(remoteIds.has(t.id)){
          await apiPost({action:'updatePlanner',id:t.id,completed:t.completed,completedAt:t.completedAt||''});
        }
      }
      setSyncMsg(`✅ Синхронизировано (+${added})`);
    }catch(e){setSyncMsg('Ошибка синхронизации');}
    setSyncing(false);setTimeout(()=>setSyncMsg(''),3000);
  }

  function addTask(){
    if(!newText.trim())return;
    const task={id:uid(),text:newText.trim(),date:selDate,priority:newPrio,completed:false,completedAt:null,comment:newNote.trim(),createdAt:tashNow()};
    save([...tasks,task]);
    setNewText('');setNewNote('');setNewPrio('medium');setShowForm(false);
    apiPost({action:'addPlanner',id:task.id,date:task.date,text:task.text,comment:task.comment,createdAt:task.createdAt}).catch(()=>{});
  }
  function toggle(id){
    const now=tashNow();
    const next=tasks.map(t=>t.id===id?{...t,completed:!t.completed,completedAt:!t.completed?now:null}:t);
    save(next);
    const t=next.find(x=>x.id===id);
    apiPost({action:'updatePlanner',id,completed:t.completed,completedAt:t.completedAt||''}).catch(()=>{});
  }
  function del(id){
    save(tasks.filter(t=>t.id!==id));
    apiPost({action:'deletePlanner',id}).catch(()=>{});
  }
  const today=todayStr();const tomorrow=tomorrowStr();
  const days=useMemo(()=>{const arr=[];for(let i=-3;i<=3;i++){const t=new Date(new Date().getTime()+5*3600000+i*86400000);const d=`${t.getUTCDate().toString().padStart(2,'0')}.${(t.getUTCMonth()+1).toString().padStart(2,'0')}.${t.getUTCFullYear()}`;const names=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];arr.push({date:d,name:names[t.getUTCDay()],num:t.getUTCDate()});}return arr;},[]);
  const weekData=useMemo(()=>days.map(d=>({...d,total:tasks.filter(t=>t.date===d.date).length,done:tasks.filter(t=>t.date===d.date&&t.completed).length})),[tasks,days]);
  const streak=useMemo(()=>{let s=0;for(let i=0;i<60;i++){if(tasks.filter(t=>t.date===nDaysAgoStr(i)&&t.completed).length>0)s++;else if(i>0)break;}return s;},[tasks]);
  const selTasks=tasks.filter(t=>t.date===selDate);
  const selDone=selTasks.filter(t=>t.completed).length;
  const weekTotal=weekData.reduce((a,d)=>a+d.total,0);
  const weekDone=weekData.reduce((a,d)=>a+d.done,0);
  const maxBar=Math.max(...weekData.map(d=>d.total),1);
  return(
    <div style={{animation:'fadeUp 0.2s ease'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
        <div>
          <h1 style={{fontSize:18,fontWeight:700,color:'#e8e8f4',marginBottom:4}}>Планер</h1>
          <p style={{fontSize:13,color:'rgba(255,255,255,0.3)'}}>Ташкент · {today}{syncMsg&&<span style={{marginLeft:8,color:syncMsg.startsWith('✅')?'#4ade80':'#fb923c'}}>{syncMsg}</span>}</p>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
          <button onClick={syncToSheets} disabled={syncing} title="Синхронизировать с Google Sheets" style={{width:32,height:32,borderRadius:8,border:'1px solid rgba(255,255,255,0.1)',background:'transparent',color:'rgba(255,255,255,0.35)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all 0.15s'}} onMouseEnter={e=>e.currentTarget.style.color='#818cf8'} onMouseLeave={e=>e.currentTarget.style.color='rgba(255,255,255,0.35)'}>
            <span style={{animation:syncing?'spin 1s linear infinite':'none',display:'inline-block'}}><I.refresh/></span>
          </button>
          <div style={{display:'flex',gap:10}}>
          <div style={{background:'#12131f',border:'1px solid rgba(251,146,60,0.2)',borderRadius:10,padding:'8px 14px',textAlign:'center',minWidth:72}}>
            <div style={{fontSize:17,fontWeight:800,color:'#fb923c',lineHeight:1}}>🔥 {streak}</div>
            <div style={{fontSize:9,color:'rgba(255,255,255,0.3)',marginTop:3,letterSpacing:'0.05em'}}>СТРИК</div>
          </div>
          <div style={{background:'#12131f',border:'1px solid rgba(74,222,128,0.2)',borderRadius:10,padding:'8px 14px',textAlign:'center',minWidth:72}}>
            <div style={{fontSize:17,fontWeight:800,color:'#4ade80',lineHeight:1}}>{weekTotal?Math.round(weekDone/weekTotal*100):0}%</div>
            <div style={{fontSize:9,color:'rgba(255,255,255,0.3)',marginTop:3,letterSpacing:'0.05em'}}>НЕДЕЛЯ</div>
          </div>
          </div>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:5,marginBottom:20}}>
        {weekData.map(d=>{
          const isSel=d.date===selDate;const isToday=d.date===today;const isTomorrow=d.date===tomorrow;const pct=d.total?d.done/d.total:0;
          return(
            <button key={d.date} onClick={()=>setSelDate(d.date)} style={{padding:'8px 4px',background:isSel?'rgba(99,102,241,0.18)':'rgba(255,255,255,0.03)',border:`1.5px solid ${isSel?'rgba(99,102,241,0.5)':isToday?'rgba(129,140,248,0.2)':'rgba(255,255,255,0.07)'}`,borderRadius:10,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,transition:'all 0.15s'}}>
              <div style={{fontSize:9,color:isSel?'#a5b4fc':isToday?'rgba(255,255,255,0.6)':'rgba(255,255,255,0.25)',fontWeight:isToday?700:400,letterSpacing:'0.04em'}}>{d.name}</div>
              <div style={{fontSize:16,fontWeight:700,color:isSel?'#fff':isToday?'#e8e8f4':'rgba(255,255,255,0.4)',lineHeight:1}}>{d.num}</div>
              {d.total>0?<div style={{width:20,height:3,background:'rgba(255,255,255,0.08)',borderRadius:2,overflow:'hidden'}}><div style={{height:'100%',width:`${pct*100}%`,background:pct>=1?'#4ade80':'#818cf8',transition:'width 0.3s'}}/></div>:(isToday||isTomorrow?<div style={{width:5,height:5,borderRadius:'50%',background:'rgba(129,140,248,0.35)'}}/>:<div style={{width:4,height:4,borderRadius:'50%',background:'rgba(255,255,255,0.06)'}}/>)}
            </button>
          );
        })}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div>
          <span style={{fontSize:14,fontWeight:600,color:'#e8e8f4'}}>{selDate===today?'Сегодня':selDate===tomorrow?'Завтра':selDate}</span>
          {selTasks.length>0&&<span style={{fontSize:12,color:'rgba(255,255,255,0.3)',marginLeft:8,fontFamily:'JetBrains Mono,monospace'}}>{selDone}/{selTasks.length}</span>}
          {selDone===selTasks.length&&selTasks.length>0&&<span style={{fontSize:11,color:'#4ade80',marginLeft:8}}>✅ Всё!</span>}
        </div>
        <button onClick={()=>setShowForm(!showForm)} style={{padding:'6px 12px',background:showForm?'rgba(239,68,68,0.12)':'rgba(99,102,241,0.18)',border:`1px solid ${showForm?'rgba(239,68,68,0.3)':'rgba(99,102,241,0.35)'}`,borderRadius:8,color:showForm?'#ef4444':'#a5b4fc',fontSize:12,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:5,transition:'all 0.15s'}}>
          {showForm?<><I.close/>Отмена</>:<><I.plus/>Задача</>}
        </button>
      </div>
      {showForm&&(
        <div style={{background:'#ffffff',border:'1.5px solid rgba(99,102,241,0.25)',borderRadius:12,padding:'14px',marginBottom:12,animation:'fadeUp 0.15s ease',boxShadow:'0 2px 12px rgba(99,102,241,0.1)'}}>
          <input value={newText} onChange={e=>setNewText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()} placeholder="Что нужно сделать?" style={{width:'100%',padding:'10px 13px',background:'rgba(0,0,0,0.04)',border:'1px solid rgba(0,0,0,0.1)',borderRadius:8,color:'#1a1b2e',fontSize:13,marginBottom:8,outline:'none',fontFamily:'Inter,sans-serif'}} autoFocus/>
          <div style={{display:'flex',gap:6,marginBottom:8}}>
            {Object.entries(PRIO).map(([k,v])=>(
              <button key={k} onClick={()=>setNewPrio(k)} style={{flex:1,padding:'6px',border:`1.5px solid ${newPrio===k?v.c:'rgba(0,0,0,0.1)'}`,borderRadius:7,background:newPrio===k?`${v.c}18`:'transparent',color:newPrio===k?v.c:'rgba(0,0,0,0.4)',fontSize:11,fontWeight:600,cursor:'pointer',transition:'all 0.15s',display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:v.c,display:'inline-block'}}/>{v.label}
              </button>
            ))}
          </div>
          <textarea value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Заметка или напоминание..." style={{width:'100%',padding:'10px 13px',background:'rgba(0,0,0,0.04)',border:'1px solid rgba(0,0,0,0.1)',borderRadius:8,color:'#1a1b2e',fontSize:12,marginBottom:8,minHeight:50,resize:'vertical',outline:'none',fontFamily:'Inter,sans-serif'}}/>
          <button onClick={addTask} disabled={!newText.trim()} className="btn btn-navy" style={{width:'100%',justifyContent:'center',fontSize:12,padding:'8px'}}><I.plus/>Добавить</button>
        </div>
      )}
      <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:24}}>
        {selTasks.length===0&&(
          <div style={{textAlign:'center',padding:'2.5rem',color:'rgba(255,255,255,0.18)',fontSize:13,background:'rgba(255,255,255,0.02)',borderRadius:12,border:'1px dashed rgba(255,255,255,0.06)'}}>
            {selDate===tomorrow?<>📋 Запланируй завтра<br/><span style={{fontSize:11,display:'block',marginTop:4,opacity:0.7}}>Нажми «+ Задача» выше</span></>:<>Задач нет — нажми «+ Задача»</>}
          </div>
        )}
        {[...selTasks].sort((a,b)=>({high:0,medium:1,low:2}[a.priority]||1)-({high:0,medium:1,low:2}[b.priority]||1)).map(task=>{
          const pc=PRIO[task.priority]||PRIO.medium;
          return(
            <div key={task.id} style={{background:task.completed?'#f0fdf4':'#ffffff',border:`1px solid ${task.completed?'rgba(74,222,128,0.35)':'rgba(0,0,0,0.07)'}`,borderRadius:10,padding:'10px 14px',display:'flex',alignItems:'flex-start',gap:10,animation:'cardIn 0.2s ease',transition:'all 0.2s',boxShadow:'0 1px 3px rgba(0,0,0,0.07)'}}>
              <button onClick={()=>toggle(task.id)} style={{width:20,height:20,borderRadius:5,border:`2px solid ${task.completed?'#22c55e':pc.c+'88'}`,background:task.completed?'#22c55e':'transparent',flexShrink:0,marginTop:2,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all 0.15s',color:'#fff',minWidth:20}}>
                {task.completed&&<I.check/>}
              </button>

              </div>
            </div>
          );
        })}
      </div>
      {weekTotal>0&&(
        <div style={{background:'#12131f',border:'1px solid rgba(255,255,255,0.07)',borderRadius:12,padding:'16px 18px'}}>
          <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.35)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:12}}>Аналитика недели</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:16}}>
            <div style={{background:'rgba(255,255,255,0.03)',borderRadius:8,padding:'10px',textAlign:'center'}}><div style={{fontSize:20,fontWeight:800,color:'#818cf8'}}>{weekTotal}</div><div style={{fontSize:9,color:'rgba(255,255,255,0.3)',marginTop:2,letterSpacing:'0.04em'}}>ЗАДАЧ</div></div>
            <div style={{background:'rgba(255,255,255,0.03)',borderRadius:8,padding:'10px',textAlign:'center'}}><div style={{fontSize:20,fontWeight:800,color:'#4ade80'}}>{weekDone}</div><div style={{fontSize:9,color:'rgba(255,255,255,0.3)',marginTop:2,letterSpacing:'0.04em'}}>ГОТОВО</div></div>
            <div style={{background:'rgba(255,255,255,0.03)',borderRadius:8,padding:'10px',textAlign:'center'}}><div style={{fontSize:20,fontWeight:800,color:'#fb923c'}}>{Math.round(weekDone/weekTotal*100)}%</div><div style={{fontSize:9,color:'rgba(255,255,255,0.3)',marginTop:2,letterSpacing:'0.04em'}}>ЭФФЕКТ</div></div>
          </div>
          <div style={{display:'flex',gap:4,alignItems:'flex-end',height:56}}>
            {weekData.map(d=>{
              const isToday=d.date===today;const isSel=d.date===selDate;
              return(
                <div key={d.date} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer'}} onClick={()=>setSelDate(d.date)}>
                  <div style={{width:'100%',height:44,display:'flex',alignItems:'flex-end'}}>
                    <div style={{width:'100%',height:d.total?`${Math.max(d.total/maxBar*100,8)}%`:'8%',background:isSel?'rgba(129,140,248,0.15)':'rgba(255,255,255,0.05)',borderRadius:'3px 3px 0 0',position:'relative',overflow:'hidden',transition:'all 0.3s'}}>
                      <div style={{position:'absolute',bottom:0,left:0,right:0,height:d.total&&d.done?`${d.done/d.total*100}%`:'0%',background:d.done===d.total&&d.total>0?'#4ade80':isToday?'#818cf8':'#6366f1',transition:'height 0.4s ease'}}/>
                    </div>
                  </div>
                  <div style={{fontSize:9,color:isSel?'#a5b4fc':isToday?'rgba(255,255,255,0.6)':'rgba(255,255,255,0.2)',fontWeight:isSel||isToday?700:400}}>{d.name}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [leads,setLeads]=useState(()=>ls(SK)||[]);
  const [page,setPage]=useState('kanban');
  const [selectedLead,setSelectedLead]=useState(null);
  const [newModal,setNewModal]=useState(null);
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState('');
  const [rop,setRop]=useState(false);
  const [groqKey,setGroqKey]=useState('');

  useEffect(()=>{
    fetch(`${API}?action=getKey`).then(r=>r.json()).then(d=>{if(d.key)setGroqKey(d.key);}).catch(()=>{});
  },[]);

  const upd=fn=>setLeads(p=>{const n=fn(p);lss(SK,n);return n;});

  async function loadKanban(){
    setLoading(true);setMsg('Загружаю...');
    try{
      const rows=await apiGet('leads');
      if(!rows||rows.length<2){setMsg('Канбан пуст');setLoading(false);return;}
      const mapped=rows.slice(1).filter(r=>r[0]).map(r=>({
        id:uid(),name:r[0]||'',firstMsg:r[1]||'',status:r[2]||STAGES[0].id,
        lastMsg:r[3]||'',amount:r[4]||'',comments:r[5]||'[]'
      }));
      upd(()=>mapped);setMsg(`${mapped.length} лидов`);
    }catch(e){setMsg('Ошибка: '+e.message);}
    setLoading(false);setTimeout(()=>setMsg(''),3000);
  }

  useEffect(()=>{if(!ls(SK)||ls(SK).length===0)loadKanban();},[]);

  async function saveLead(data,silent){
    const now=tashNow();
    const row=[data.name,data.firstMsg||now,data.status,now,data.amount||'',data.comments||'[]'];
    if(data.id){
      const oldName=leads.find(l=>l.id===data.id)?.name;
      upd(p=>p.map(l=>l.id===data.id?{...l,...data,lastMsg:now}:l));
      setSelectedLead(prev=>prev&&prev.id===data.id?{...prev,...data,lastMsg:now}:prev);
      await apiPost({action:'update',name:oldName||data.name,row,sheet:'leads'});
    }else{
      const nl={...data,id:uid(),lastMsg:now};
      upd(p=>[nl,...p]);
      await apiPost({action:'add',row,sheet:'leads'});
    }
  }

  async function deleteLead(id){
    const lead=leads.find(l=>l.id===id);
    upd(p=>p.filter(l=>l.id!==id));
    if(lead)await apiPost({action:'delete',name:lead.name,sheet:'leads'});
  }

  async function moveLead(id,status){
    const lead=leads.find(l=>l.id===id);if(!lead)return;
    const now=tashNow();
    upd(p=>p.map(l=>l.id===id?{...l,status,lastMsg:now}:l));
    await apiPost({action:'update',name:lead.name,row:[lead.name,lead.firstMsg,status,now,lead.amount||'',lead.comments||'[]'],sheet:'leads'});
  }

  // ✅ ИСПРАВЛЕНО: правильная логика переноса из Pipeline в Kanban
  function sendToKanban(cl,status,comment){
    const now=tashNow();
    
    // Берём firstMessage из All Leads как первый комментарий
    const comments=[];
    if(cl.firstMessage){
      comments.push({id:uid(),text:'📤 Сообщение агента: '+cl.firstMessage,time:now});
    }
    if(comment&&comment.trim()){
      comments.push({id:uid(),text:comment.trim(),time:now});
    }
    
    const newLead={
      id:uid(),
      name:cl.businessName||cl.username,
      firstMsg:now,
      status:status,
      lastMsg:now,
      amount:'',
      comments:JSON.stringify(comments)
    };

    // Мгновенно добавляем локально
    upd(p=>[newLead,...p]);
    
    // Переходим на канбан
    setPage('kanban');
    setMsg(`✅ ${newLead.name} добавлен в канбан`);
    setTimeout(()=>setMsg(''),3000);

    // Пишем в Sheets в фоне
    const row=[newLead.name,newLead.firstMsg,newLead.status,newLead.lastMsg,'',newLead.comments];
    apiPost({action:'add',row,sheet:'leads'}).catch(e=>console.error('Sheets error:',e));
  }

  const total=leads.length;
  const active=leads.filter(l=>l.status!=='Closed'&&l.status!=='Not interested').length;
  const won=leads.filter(l=>l.status==='Closed').length;

  const NAV=[
    {id:'kanban',icon:<I.kanban/>,label:'Канбан'},
    {id:'pipeline',icon:<I.pipe/>,label:'Pipeline'},
    {id:'analytics',icon:<I.chart/>,label:'Аналитика'},
    {id:'goal',icon:<I.goal/>,label:'Цель'},
    {id:'planner',icon:<I.planner/>,label:'Планер'},
    {id:'content',icon:<I.content/>,label:'Контент'},
  ];

  return(
    <div style={{display:'flex',minHeight:'100vh',background:'var(--bg)'}}>
      <aside style={{width:210,flexShrink:0,background:'#08090e',display:'flex',flexDirection:'column',height:'100vh',position:'sticky',top:0,boxShadow:'1px 0 0 rgba(255,255,255,0.06)'}}>
        <div style={{padding:'20px 16px 16px',borderBottom:'1px solid rgba(255,255,255,0.06)',display:'flex',justifyContent:'center'}}>
          <img src={LOGO} alt="AAI Agency" style={{width:80,height:30,objectFit:'contain'}}/>
        </div>
        <div style={{padding:'12px 12px 6px'}}>
          <button onClick={()=>setNewModal({status:STAGES[0].id})} style={{width:'100%',padding:'9px 14px',background:'rgba(99,102,241,0.2)',border:'1px solid rgba(99,102,241,0.4)',borderRadius:8,color:'#a5b4fc',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:8,cursor:'pointer',fontFamily:'DM Sans,sans-serif',transition:'all 0.15s'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(99,102,241,0.3)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(99,102,241,0.2)'}><I.plus/>Новый лид</button>
        </div>
        <nav style={{padding:'4px 10px',flex:1}}>
          {NAV.map(n=>(
            <button key={n.id} className={`slink${page===n.id?' act':''}`} onClick={()=>setPage(n.id)}>{n.icon}{n.label}</button>
          ))}
          <div style={{height:1,background:'rgba(255,255,255,0.07)',margin:'7px 4px'}}/>
          <button className={`slink${rop?' act':''}`} onClick={()=>setRop(!rop)}><I.rop/>Robert (РОП)</button>
        </nav>
        <div style={{padding:'10px 12px',borderTop:'1px solid rgba(255,255,255,0.07)'}}>
          <button onClick={loadKanban} disabled={loading} style={{width:'100%',padding:'8px 12px',background:'transparent',border:'1px solid rgba(255,255,255,0.08)',borderRadius:8,color:'rgba(255,255,255,0.35)',fontSize:12,fontWeight:500,display:'flex',alignItems:'center',justifyContent:'center',gap:7,cursor:'pointer',fontFamily:'DM Sans,sans-serif',transition:'all 0.15s'}} onMouseEnter={e=>{e.currentTarget.style.color='#fff';e.currentTarget.style.borderColor='rgba(255,255,255,0.25)';}} onMouseLeave={e=>{e.currentTarget.style.color='rgba(255,255,255,0.5)';e.currentTarget.style.borderColor='rgba(255,255,255,0.12)';}}>
            <span style={{animation:loading?'spin 1s linear infinite':'none',display:'inline-block'}}><I.refresh/></span>
            {loading?'Загружаю...':'Обновить'}
          </button>
          {msg&&<div style={{fontSize:10,color:'rgba(255,255,255,0.3)',marginTop:5,textAlign:'center',fontFamily:'JetBrains Mono,monospace'}}>{msg}</div>}
        </div>
        <div style={{padding:'8px 16px 16px',fontSize:11,color:'rgba(255,255,255,0.2)',lineHeight:2,fontFamily:'JetBrains Mono,monospace'}}>
          <div>{total} лидов · {active} активных</div>
          <div style={{color:'rgba(34,197,94,0.7)',fontWeight:600}}>{won} продаж</div>
        </div>
      </aside>

      <main style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        <div style={{padding:'12px 24px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,background:'#0d0e1a',zIndex:10,borderBottom:'1px solid rgba(255,255,255,0.07)'}}>
          <div>
            <h1 style={{fontSize:18,fontWeight:700,letterSpacing:'-0.02em',color:'#e8e8f4'}}>{NAV.find(n=>n.id===page)?.label||'AAI CRM'}</h1>
            {page==='kanban'&&<p style={{fontSize:11,color:'rgba(255,255,255,0.3)',marginTop:1,fontFamily:'JetBrains Mono,monospace'}}>{total} лидов · {active} активных · {won} продаж</p>}
          </div>
          <div style={{display:'flex',gap:9}}>
            {page==='kanban'&&<button className="btn btn-navy" style={{fontSize:13}} onClick={()=>setNewModal({status:STAGES[0].id})}><I.plus/>Новый лид</button>}
            <button className="btn" style={rop?{background:'var(--red)',color:'#fff'}:{background:'transparent',color:'rgba(255,255,255,0.5)',border:'1px solid rgba(255,255,255,0.1)'}} onClick={()=>setRop(!rop)}>
              <I.rop/>{rop?'Закрыть':'Robert'}
            </button>
          </div>
        </div>
        <div style={{flex:1,padding:'16px 20px',overflowY:'auto',display:'flex',flexDirection:'column',background:'var(--bg)'}}>
          {page==='kanban'&&<KanbanBoard leads={leads} onCardClick={l=>setSelectedLead(l)} onMove={moveLead} onAdd={s=>setNewModal({status:s})}/>}
          {page==='pipeline'&&<PipelinePage onSendToKanban={sendToKanban}/>}
          {page==='analytics'&&<AnalyticsPage leads={leads} groqKey={groqKey}/>}
          {page==='goal'&&<GoalPage/>}
          {page==='planner'&&<PlannerPage/>}
          {page==='content'&&<ContentPage/>}
        </div>
        <Wave/>
      </main>

      {selectedLead&&<LeadModal lead={selectedLead} onClose={()=>setSelectedLead(null)} onSave={data=>saveLead({...selectedLead,...data})} onDelete={id=>{deleteLead(id);setSelectedLead(null);}}/>}
      {rop&&<RopPanel leads={leads} groqKey={groqKey} onClose={()=>setRop(false)}/>}
      {newModal&&<NewLeadModal defaultStatus={newModal.status} onSave={data=>saveLead(data)} onClose={()=>setNewModal(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
