<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AAI Agency CRM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1b3e;--navy2:#1a2f5e;--bg:#f8faff;--surface:#ffffff;--border:#e8edf8;--border2:#c7d2ee;--text:#0d1b3e;--text2:#4a5580;--text3:#94a3c8;--green:#059669;--green-bg:#f0fdf8;--red:#ef4444;--red-bg:#fff5f5;--blue:#2563eb;
}
html{font-size:15px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
button{font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.18s ease}
input,textarea,select{font-family:'DM Sans',sans-serif}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy)!important;box-shadow:0 0 0 3px rgba(13,27,62,0.08)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse-gold{0%,100%{filter:drop-shadow(0 0 8px #f59e0b)}50%{filter:drop-shadow(0 0 20px #f59e0b) drop-shadow(0 0 40px #fbbf24)}}
@keyframes pulse-mid{0%,100%{filter:drop-shadow(0 0 4px #f59e0b)}50%{filter:drop-shadow(0 0 12px #f59e0b)}}
@keyframes win-glow{0%,100%{filter:drop-shadow(0 0 20px #f59e0b) drop-shadow(0 0 50px #fbbf24)}50%{filter:drop-shadow(0 0 40px #f59e0b) drop-shadow(0 0 80px #fbbf24)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(140px) rotate(720deg);opacity:0}}
.kcard{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;height:112px;cursor:pointer;transition:all 0.2s ease;animation:cardIn 0.3s ease both}
.kcard:hover{border-color:var(--border2);box-shadow:0 6px 20px rgba(13,27,62,0.09);transform:translateY(-2px)}
.kcard:active{transform:scale(0.99)}
.kcard.sale{border-left:3px solid var(--green);background:var(--green-bg)}
.kcard.lost{border-left:3px solid var(--red);background:var(--red-bg)}
.btn{padding:10px 20px;border:none;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;letter-spacing:-0.01em;font-family:'DM Sans',sans-serif}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(13,27,62,0.25)}
.btn-navy:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:transparent;color:var(--text2);border:1.5px solid var(--border)}
.btn-outline:hover{background:var(--surface);border-color:var(--border2);color:var(--text)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#047857}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#1d4ed8;transform:translateY(-1px)}
.btn-blue:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.inp{width:100%;padding:10px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;transition:all 0.15s}
.slink{width:100%;padding:9px 12px;border:none;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;background:transparent;color:rgba(255,255,255,0.45);cursor:pointer;transition:all 0.15s;margin-bottom:2px;text-align:left;font-family:'DM Sans',sans-serif}
.slink:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.85)}
.slink.act{background:rgba(255,255,255,0.14);color:#fff;font-weight:600}
.modal-wrap{position:fixed;inset:0;background:rgba(13,27,62,0.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;animation:fadeIn 0.15s ease}
.modal-box{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;max-width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(13,27,62,0.18);animation:slideUp 0.22s ease}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;margin-bottom:9px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const API = 'https://script.google.com/macros/s/AKfycbzlEiUktgoZmO4DCrSXh1x6kMKI0Ub29gCD2IuWoOYLfnLRTAJ3MjWBqvjK8jP_Ggzx/exec';

const SK='aai_k_v11';const SC='aai_c_v11';const SG='aai_goal_v3';

const STAGES=[
  {id:'Sent first message',label:'Первое касание'},
  {id:'Sent demo',label:'Демо отправлено'},
  {id:'Thinking on KP',label:'КП — думает'},
  {id:'Booked a call',label:'Созвон'},
  {id:'Closed',label:'Продажа'},
  {id:'Not interested',label:'Отказ'},

const TIER={IDEAL:{c:'#059669',bg:'#ecfdf5'},POTENTIAL:{c:'#2563eb',bg:'#eff6ff'},LOW:{c:'#9ca3af',bg:'#f3f4f6'}};

const LOGO='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjQwIiB2aWV3Qm94PSIwIDAgMTIwIDQwIiBmaWxsPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0ZXh0IHg9IjYiIHk9IjI4IiBmb250LWZhbWlseT0iRE0gU2FucyIgZm9udC13ZWlnaHQ9IjgwMCIgZm9udC1zaXplPSIyNiIgZmlsbD0id2hpdGUiPkFBSTwvdGV4dD48dGV4dCB4PSI2IiB5PSIzOCIgZm9udC1mYW1pbHk9IkRNIFNhbnMiIGZvbnQtd2VpZ2h0PSI0MDAiIGZvbnQtc2l6ZT0iOSIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjUpIj5BR0VOQ1k8L3RleHQ+PC9zdmc+';

function ls(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch{return null}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function tashNow(){
  const t=new Date(new Date().getTime()+5*3600000);
  return `${t.getUTCDate().toString().padStart(2,'0')}.${(t.getUTCMonth()+1).toString().padStart(2,'0')}.${t.getUTCFullYear()} ${t.getUTCHours().toString().padStart(2,'0')}:${t.getUTCMinutes().toString().padStart(2,'0')}`;
}
function tashDay(){
  const days=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const t=new Date(new Date().getTime()+5*3600000);
  return{day:days[t.getUTCDay()],hour:t.getUTCHours(),date:tashNow()};
}
function fmtDate(v){
  if(!v)return'';
  if(typeof v==='string'&&v.includes('T')){
    const t=new Date(new Date(v).getTime()+5*3600000);
    return `${t.getUTCDate().toString().padStart(2,'0')}.${(t.getUTCMonth()+1).toString().padStart(2,'0')}.${t.getUTCFullYear()} ${t.getUTCHours().toString().padStart(2,'0')}:${t.getUTCMinutes().toString().padStart(2,'0')}`;
  }
  return v;
}
function parseComments(raw){
  if(!raw)return[];
  try{const p=JSON.parse(raw);return Array.isArray(p)?p:[];}
  catch{if(typeof raw==='string'&&raw.trim())return[{id:uid(),text:raw,time:tashNow()}];return[];}
}
function groupByDay(comments){
  const g={};
  comments.forEach(c=>{const d=c.time?c.time.split(' ')[0]:'—';if(!g[d])g[d]=[];g[d].push(c);});
  return g;
}
async function apiGet(sheet){
  return(await fetch(`${API}?sheet=${encodeURIComponent(sheet)}`)).json();
}
async function apiPost(body){
  await fetch(API,{method:'POST',body:JSON.stringify(body)});
}

const I={
  kanban:()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="1" y="1" width="4" height="14" rx="1"/><rect x="6" y="1" width="4" height="9" rx="1"/><rect x="11" y="1" width="4" height="11" rx="1"/></svg>,
  pipe:()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="3" cy="8" r="2"/><circle cx="13" cy="4" r="2"/><circle cx="13" cy="12" r="2"/><line x1="5" y1="7.3" x2="11" y2="4.7"/><line x1="5" y1="8.7" x2="11" y2="11.3"/></svg>,
  chart:()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="1,12 5,7 9,9 15,3"/><line x1="1" y1="15" x2="15" y2="15"/></svg>,
  goal:()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="7"/><circle cx="8" cy="8" r="3.5"/><circle cx="8" cy="8" r="1" fill="currentColor"/></svg>,
  rop:()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>,
  plus:()=><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>,
  edit:()=><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M11 2l3 3-9 9H2v-3L11 2z"/></svg>,
  trash:()=><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="2,4 14,4"/><path d="M5 4V2h6v2"/><path d="M3 4l1 10h8l1-10"/></svg>,
  close:()=><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>,
  check:()=><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="2,8 6,12 14,4"/></svg>,
  send:()=><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8"><line x1="14" y1="2" x2="6" y2="10"/><polygon points="14,2 9,14 6,10 2,7" fill="currentColor" stroke="none"/></svg>,
  msg:()=><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M14 2H2a1 1 0 00-1 1v8a1 1 0 001 1h3l2 2 2-2h5a1 1 0 001-1V3a1 1 0 00-1-1z"/></svg>,
  refresh:()=><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M13.5 8A5.5 5.5 0 112.5 5"/><polyline points="2,2 2.5,5 5.5,4.5"/></svg>,
  link:()=><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M6 9a3 3 0 004.5.5l2-2A3 3 0 008 3.5L7 4.5"/><path d="M10 7a3 3 0 00-4.5-.5l-2 2A3 3 0 008 12.5l1-1"/></svg>,
  arR:()=><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2"><line x1="2" y1="8" x2="14" y2="8"/><polyline points="9,3 14,8 9,13"/></svg>,
  import:()=><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M8 2v9"/><polyline points="4,7 8,11 12,7"/><path d="M2 14h12"/></svg>,
};

function Wave(){
  return(
    <div style={{position:'relative',height:40,flexShrink:0,overflow:'hidden',background:'var(--bg)'}}>
      <svg viewBox="0 0 1440 40" preserveAspectRatio="none" style={{position:'absolute',bottom:0,width:'200%',height:40,animation:'waveMove 6s linear infinite'}}>
        <path d="M0,20 C180,40 360,0 540,20 C720,40 900,0 1080,20 C1260,40 1440,0 1440,20 L1440,40 L0,40 Z" fill="rgba(13,27,62,0.06)"/>
        <path d="M0,26 C200,8 400,40 600,26 C800,12 1000,40 1200,26 C1340,18 1400,30 1440,26 L1440,40 L0,40 Z" fill="rgba(13,27,62,0.04)"/>
      </svg>
    </div>
  );
}

function LeadModal({lead,onClose,onSave,onDelete}){
  const [name,setName]=useState(lead.name||'');
  const [status,setStatus]=useState(lead.status||STAGES[0].id);
  const [amount,setAmount]=useState(lead.amount||'');
  const [comments,setComments]=useState(()=>parseComments(lead.comments));
  const [newComment,setNewComment]=useState('');
  const [saving,setSaving]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[comments]);
  const grouped=useMemo(()=>groupByDay(comments),[comments]);
  const isDirty=name!==lead.name||status!==lead.status||amount!==lead.amount;
  const isSale=status==='Closed';
  const isLost=status==='Not interested';
  function addComment(){
    if(!newComment.trim())return;
    const c={id:uid(),text:newComment.trim(),time:tashNow()};
    const updated=[...comments,c];
    setComments(updated);setNewComment('');
    onSave({...lead,name,status,amount,comments:JSON.stringify(updated),lastMsg:tashNow()},true);
  }
  async function handleSave(){
    setSaving(true);
    await onSave({...lead,name,status,amount,comments:JSON.stringify(comments),lastMsg:tashNow()});
    setSaving(false);
  }
  const ibtn={width:30,height:30,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:8,color:'var(--text3)',cursor:'pointer',transition:'all 0.15s'};
  return(
    <div className="modal-wrap" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box" style={{width:460}}>
        <div style={{padding:'18px 20px',borderBottom:'1.5px solid var(--border)',flexShrink:0,background:isSale?'#f0fdf8':isLost?'#fff5f5':'var(--surface)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
            <input value={name} onChange={e=>setName(e.target.value)} style={{fontSize:17,fontWeight:800,letterSpacing:'-0.02em',border:'none',background:'transparent',color:'var(--text)',flex:1,marginRight:12,padding:0,outline:'none'}}/>
            <div style={{display:'flex',gap:7,flexShrink:0}}>
              {isDirty&&<button onClick={handleSave} disabled={saving} style={{...ibtn,background:saving?'var(--bg)':'var(--navy)',border:'none',color:'#fff',width:'auto',padding:'0 12px',fontSize:12,fontWeight:600}}>{saving?'...':'Сохранить'}</button>}
              <button style={ibtn} onClick={()=>{if(confirm('Удалить лид?')){onDelete(lead.id);onClose();}}} onMouseEnter={e=>e.currentTarget.style.color='var(--red)'} onMouseLeave={e=>e.currentTarget.style.color='var(--text3)'}><I.trash/></button>
              <button style={ibtn} onClick={onClose}><I.close/></button>
            </div>
          </div>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {STAGES.map(s=>{
              const active=status===s.id;
              const bg=active?(s.id==='Closed'?'var(--green)':s.id==='Not interested'?'var(--red)':'var(--navy)'):'transparent';
              const col=active?'#fff':(s.id==='Closed'?'var(--green)':s.id==='Not interested'?'var(--red)':'var(--text3)');
              const border=active?(s.id==='Closed'?'var(--green)':s.id==='Not interested'?'var(--red)':'var(--navy)'):'var(--border)';
              return(<button key={s.id} onClick={()=>setStatus(s.id)} style={{padding:'4px 11px',borderRadius:20,border:`1.5px solid ${border}`,background:bg,color:col,fontSize:11,fontWeight:600,cursor:'pointer',transition:'all 0.15s'}}>{s.label}</button>);
            })}
          </div>
          {isSale&&<input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="Сумма сделки ($)" className="inp" style={{marginTop:10,borderColor:'var(--green)'}}/>}
        </div>
        <div style={{padding:'8px 20px',borderBottom:'1.5px solid var(--border)',fontSize:11,color:'var(--text3)',fontFamily:'JetBrains Mono,monospace',display:'flex',gap:16,flexShrink:0}}>
          <span>↗ {fmtDate(lead.firstMsg)||'—'}</span>
          <span>↻ {fmtDate(lead.lastMsg)||'—'}</span>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'12px 20px',minHeight:160,maxHeight:260}}>
          {Object.keys(grouped).length===0&&<div style={{textAlign:'center',padding:'2.5rem 1rem',color:'var(--text3)',fontSize:13}}><div style={{fontSize:28,marginBottom:8}}>💬</div>Напиши первый комментарий</div>}
          {Object.keys(grouped).map(day=>(
            <div key={day}>
              <div style={{textAlign:'center',margin:'10px 0 8px'}}><span style={{fontSize:10,fontWeight:600,color:'var(--text3)',background:'var(--bg)',padding:'2px 10px',borderRadius:20,fontFamily:'JetBrains Mono,monospace'}}>{day}</span></div>
              {grouped[day].map(c=>(
                <div key={c.id} style={{background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:10,padding:'9px 13px',marginBottom:7}}>
                  <div style={{fontSize:13,color:'var(--text)',lineHeight:1.65}}>{c.text}</div>
                  <div style={{fontSize:10,color:'var(--text3)',fontFamily:'JetBrains Mono,monospace',marginTop:3}}>{c.time?.split(' ')[1]||''} · Ташкент</div>
                </div>
              ))}
            </div>
          ))}
          <div ref={endRef}/>
        </div>
        <div style={{padding:'12px 20px',borderTop:'1.5px solid var(--border)',flexShrink:0,display:'flex',gap:8,alignItems:'flex-end'}}>
          <textarea value={newComment} onChange={e=>setNewComment(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addComment();}}} placeholder="Комментарий... (Enter — отправить)" style={{flex:1,padding:'9px 12px',background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:13,resize:'none',minHeight:40,maxHeight:100,lineHeight:1.6,fontFamily:'DM Sans,sans-serif'}}/>
          <button onClick={addComment} style={{width:38,height:38,background:'var(--navy)',border:'none',borderRadius:10,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><I.send/></button>
        </div>
      </div>
    </div>
  );
}

function NewLeadModal({defaultStatus,onSave,onClose}){
  const [name,setName]=useState('');
  const [status,setStatus]=useState(defaultStatus||STAGES[0].id);
  return(
    <div className="modal-wrap" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box" style={{width:420,padding:'1.75rem'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem'}}>
          <div style={{fontSize:17,fontWeight:800,letterSpacing:'-0.02em'}}>Новый лид</div>
          <button onClick={onClose} style={{width:30,height:30,background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:8,color:'var(--text3)',display:'flex',alignItems:'center',justifyContent:'center'}}><I.close/></button>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:5}}>Компания *</label>
          <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="Название компании" autoFocus onKeyDown={e=>e.key==='Enter'&&name.trim()&&(onSave({name,status,comments:'[]',firstMsg:tashNow(),lastMsg:tashNow(),amount:''}),onClose())}/>
        </div>
        <div style={{marginBottom:18}}>
          <label style={{display:'block',fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:5}}>Этап</label>
          <select className="inp" value={status} onChange={e=>setStatus(e.target.value)}>{STAGES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select>
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button className="btn btn-outline" onClick={onClose}>Отмена</button>
          <button className="btn btn-navy" onClick={()=>{if(!name.trim())return;onSave({name,status,comments:'[]',firstMsg:tashNow(),lastMsg:tashNow(),amount:''});onClose();}}><I.check/>Создать</button>
        </div>
      </div>
    </div>
  );
}

function KCard({lead,onClick,delay}){
  const isSale=lead.status==='Closed';
  const isLost=lead.status==='Not interested';
  const comments=useMemo(()=>parseComments(lead.comments),[lead.comments]);
  const last=comments[comments.length-1];
  return(

      const rows=await apiGet('All Leads');

      setLeads(mapped);lss(SC,mapped);setMsg(`✅ ${mapped.length} лидов`);

          <button key={t} onClick={()=>setTier(t)} style={{padding:'9px 15px',background:tier===t?'var(--navy)':'var(--surface)',border:`1.5px solid ${tier===t?'var(--navy)':'var(--border)'}`,borderRadius:10,color:tier===t?'#fff':'var(--text2)',fontSize:12,fontWeight:600,display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}>
            {t==='ALL'?'Все':t}<span style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,opacity:0.6}}>{counts[t]||0}</span>
          </button>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(268px,1fr))',gap:12}}>
        {filtered.map(l=><div key={l.id}><PipelineCard lead={l} onClick={()=>setSelected(l)}/></div>)}
        {filtered.length===0&&<div style={{gridColumn:'1/-1',textAlign:'center',padding:'4rem',color:'var(--text3)',fontSize:14}}>{leads.length===0?'Нажми «Обновить»':'Ничего не найдено'}</div>}

      {selected&&<PipelineModal lead={selected} onClose={()=>setSelected(null)} onSend={(l,s,c)=>{onSendToKanban(l,s,c);setSelected(null);}}/>}
    </div>
  );
}

function AnalyticsPage({leads,groqKey}){
  const [ai,setAi]=useState('');const [loading,setLoading]=useState(false);
  const st=useMemo(()=>{
    const total=leads.length;
    const byStage=STAGES.map(s=>({...s,count:leads.filter(l=>l.status===s.id).length}));
    const won=leads.filter(l=>l.status==='Closed').length;
    const lost=leads.filter(l=>l.status==='Not interested').length;
    const conv=total?Math.round((won/total)*100):0;
    return{total,byStage,won,lost,conv};
  },[leads]);
  async function analyze(){
    if(leads.length<2){setAi('Нужно хотя бы 2-3 лида.');return;}
    setLoading(true);setAi('');
    try{
      const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':`Bearer ${groqKey}`,'Content-Type':'application/json'},body:JSON.stringify({model:'openai/gpt-oss-120b',max_tokens:800,messages:[{role:'system',content:'Ты аналитик продаж. Структура: УЗКОЕ ГОРЛЫШКО / ЧТО РАБОТАЕТ / КОНКРЕТНЫЙ СОВЕТ. По-русски, коротко.'},{role:'user',content:JSON.stringify({total:st.total,byStage:st.byStage.map(s=>({s:s.label,c:s.count})),won:st.won,lost:st.lost,conv:st.conv+'%'})}]})});
      const d=await res.json();setAi(d.choices?.[0]?.message?.content||'Ошибка');
    }catch(e){setAi('Ошибка: '+e.message);}
    setLoading(false);
  }
  const colors=['#2563eb','#7c3aed','#d97706','#0891b2','#059669','#ef4444'];
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14,animation:'fadeUp 0.2s ease'}}>
      <h1 style={{fontSize:22,fontWeight:800,letterSpacing:'-0.03em'}}>Аналитика</h1>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(148px,1fr))',gap:12}}>
        {[['Всего лидов',st.total,'var(--text)'],['Продаж',st.won,'var(--green)'],['Отказов',st.lost,'var(--red)'],['Конверсия',st.conv+'%','var(--blue)']].map(([l,v,c])=>(
          <div key={l} style={{background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:13,padding:'18px 20px'}}>
            <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:8}}>{l}</div>
            <div style={{fontSize:30,fontWeight:900,color:c,fontFamily:'JetBrains Mono,monospace',letterSpacing:'-0.02em'}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:13,padding:'1.4rem'}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:16}}>Воронка</div>
        {st.byStage.map((s,i)=>{const w=st.total>0?Math.round((s.count/st.total)*100):0;return(
          <div key={s.id} style={{display:'flex',alignItems:'center',gap:12,marginBottom:13}}>
            <div style={{width:7,height:7,borderRadius:'50%',background:colors[i],flexShrink:0}}/>
            <div style={{width:148,flexShrink:0,fontSize:12,color:'var(--text2)',fontWeight:500}}>{s.label}</div>
            <div style={{flex:1,height:7,background:'var(--bg)',borderRadius:4,overflow:'hidden'}}><div style={{height:'100%',width:w+'%',background:colors[i],borderRadius:4,minWidth:s.count>0?4:0,transition:'width 0.6s ease'}}/></div>
            <div style={{fontSize:12,fontFamily:'JetBrains Mono,monospace',color:'var(--text2)',width:20,textAlign:'right',fontWeight:700}}>{s.count}</div>
            <div style={{fontSize:10,fontFamily:'JetBrains Mono,monospace',color:'var(--text3)',width:30,textAlign:'right'}}>{w}%</div>
          </div>
        );})}
      </div>
      <div style={{background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:13,padding:'1.4rem'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:ai||loading?12:0}}>
          <div style={{fontSize:13,fontWeight:700}}>AI-анализ воронки</div>
          <button className="btn btn-navy" onClick={analyze} disabled={loading} style={{fontSize:12,padding:'8px 16px'}}>{loading?'Анализирую...':'Анализировать'}</button>
        </div>
        {!ai&&!loading&&<p style={{fontSize:13,color:'var(--text3)',lineHeight:1.7,marginTop:8}}>AI найдёт где теряются лиды.</p>}
        {ai&&<p style={{fontSize:13,lineHeight:1.85,whiteSpace:'pre-wrap',color:'var(--text)',marginTop:8}}>{ai}</p>}
      </div>
    </div>
  );
}

  const [editGoal,setEditGoal]=useState(false);
  const [newTarget,setNewTarget]=useState('');
  const [addSale,setAddSale]=useState(false);
  const [saleAmt,setSaleAmt]=useState('');
  const [saleNote,setSaleNote]=useState('');
  const [confetti,setConfetti]=useState(false);
  const total=useMemo(()=>g.sales.reduce((s,x)=>s+(x.amount||0),0),[g.sales]);
  const pct=Math.min(Math.round((total/g.target)*100),999);
  const daysLeft=useMemo(()=>{
    const start=new Date(g.startDate?.split(' ')[0]?.split('.').reverse().join('-')||Date.now());
    return Math.max(0,Math.ceil((new Date(start.getTime()+30*24*3600000)-new Date())/(24*3600000)));
  },[g.startDate]);
  function save(x){setG(x);lss(SG,x);}
  function startNew(){const t=parseInt(newTarget);if(!t)return;save({target:t,startDate:tashNow(),sales:[]});setEditGoal(false);setNewTarget('');}
  function addSaleRec(){
    const amt=parseFloat(saleAmt);if(!amt)return;
    const was=total<g.target;
    const ns=[...g.sales,{id:uid(),amount:amt,note:saleNote,date:tashNow()}];
    save({...g,sales:ns});setSaleAmt('');setSaleNote('');setAddSale(false);
    if(was&&ns.reduce((s,x)=>s+x.amount,0)>=g.target){setConfetti(true);setTimeout(()=>setConfetti(false),4000);}
  }
  const minp={width:'100%',padding:'10px 13px',background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:13,fontFamily:'DM Sans,sans-serif'};
  return(
    <div style={{animation:'fadeUp 0.2s ease',maxWidth:660,margin:'0 auto'}}>
      {confetti&&<Confetti/>}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20,flexWrap:'wrap',gap:12}}>
        <div><h1 style={{fontSize:22,fontWeight:800,letterSpacing:'-0.03em',marginBottom:4}}>Цель на 30 дней</h1><p style={{fontSize:13,color:'var(--text3)'}}>Старт: {g.startDate?.split(' ')[0]} · Осталось {daysLeft} дн.</p></div>
        <button className="btn btn-outline" onClick={()=>setEditGoal(true)}><I.edit/>Изменить</button>
      </div>
      <div style={{background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:16,padding:'22px',marginBottom:14,textAlign:'center'}}>
        <Trophy pct={pct}/>
        <div style={{display:'flex',justifyContent:'center',gap:28,marginTop:6}}>
          {[['Заработано','$'+total.toLocaleString(),'var(--green)'],['Цель','$'+g.target.toLocaleString(),'var(--text)'],['Выполнено',pct+'%',pct>=100?'#f59e0b':'var(--navy)']].map(([l,v,c])=>(
            <div key={l}><div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:4}}>{l}</div><div style={{fontSize:28,fontWeight:900,color:c,fontFamily:'JetBrains Mono,monospace',letterSpacing:'-0.02em'}}>{v}</div></div>
          ))}
        </div>
        <div style={{marginTop:18,position:'relative',height:48,background:'#e8f4fd',borderRadius:12,overflow:'hidden',border:'1.5px solid #bae6fd'}}>
          <div style={{position:'absolute',bottom:0,left:0,width:`${Math.min(pct,100)}%`,height:'100%',background:pct>=100?'linear-gradient(90deg,#059669,#34d399)':'linear-gradient(90deg,var(--navy),#1a2f5e)',transition:'width 1s ease'}}/>
          {[25,50,75].map(m=><div key={m} style={{position:'absolute',left:m+'%',top:0,bottom:0,borderLeft:'1px dashed rgba(255,255,255,0.4)'}}><span style={{fontSize:9,color:'rgba(255,255,255,0.7)',fontFamily:'JetBrains Mono,monospace',fontWeight:600,paddingLeft:3,paddingTop:4,display:'block'}}>{m}%</span></div>)}
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{fontSize:12,fontWeight:800,color:pct>40?'#fff':'var(--navy)',fontFamily:'JetBrains Mono,monospace'}}>${total.toLocaleString()} / ${g.target.toLocaleString()}</span></div>
        </div>
        <button className="btn btn-navy" style={{marginTop:14,fontSize:13}} onClick={()=>setAddSale(true)}><I.plus/>Добавить продажу</button>
      </div>
      {g.sales.length>0&&(
        <div style={{background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:14,padding:'18px'}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>История продаж</div>
          {[...g.sales].reverse().map(s=>(
            <div key={s.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 13px',background:'var(--bg)',borderRadius:10,border:'1.5px solid var(--border)',marginBottom:7}}>
              <div><div style={{fontSize:14,fontWeight:700,color:'var(--green)',fontFamily:'JetBrains Mono,monospace'}}>+${s.amount.toLocaleString()}</div>{s.note&&<div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>{s.note}</div>}</div>
              <div style={{fontSize:10,color:'var(--text3)',fontFamily:'JetBrains Mono,monospace'}}>{s.date?.split(' ')[0]}</div>
            </div>
          ))}
        </div>
      )}
      {editGoal&&(
        <div className="modal-wrap" onClick={e=>e.target===e.currentTarget&&setEditGoal(false)}>
          <div className="modal-box" style={{width:360,padding:'1.75rem'}}>
            <div style={{fontSize:16,fontWeight:800,marginBottom:16}}>Новая цель</div>
            <div style={{marginBottom:8}}><label style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.07em',display:'block',marginBottom:5}}>Сумма ($)</label><input style={minp} type="number" value={newTarget} onChange={e=>setNewTarget(e.target.value)} placeholder="5000" autoFocus/></div>
            <div style={{fontSize:12,color:'var(--text3)',marginBottom:14}}>Текущие продажи сбросятся.</div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button className="btn btn-outline" onClick={()=>setEditGoal(false)}>Отмена</button>
              <button className="btn btn-navy" onClick={startNew}><I.check/>Начать</button>
            </div>
          </div>
        </div>
      )}
      {addSale&&(
        <div className="modal-wrap" onClick={e=>e.target===e.currentTarget&&setAddSale(false)}>
          <div className="modal-box" style={{width:360,padding:'1.75rem'}}>
            <div style={{fontSize:16,fontWeight:800,marginBottom:16}}>Записать продажу</div>
            <div style={{marginBottom:12}}><label style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.07em',display:'block',marginBottom:5}}>Сумма ($) *</label><input style={minp} type="number" value={saleAmt} onChange={e=>setSaleAmt(e.target.value)} placeholder="1200" autoFocus/></div>
            <div style={{marginBottom:16}}><label style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.07em',display:'block',marginBottom:5}}>Клиент</label><input style={minp} value={saleNote} onChange={e=>setSaleNote(e.target.value)} placeholder="Kurbanov Dental"/></div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button className="btn btn-outline" onClick={()=>setAddSale(false)}>Отмена</button>
              <button className="btn btn-green" onClick={addSaleRec}><I.check/>Записать</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const ROP_SYSTEM=`Ты — Robert, руководитель отдела продаж (РОП) в AAI Agency. Ты НЕ советник и НЕ ассистент. Ты — РОП, который несёт персональную ответственность за каждую сделку Асада.

КОНТЕКСТ: Продукт: AI Sales Manager ($700–1500). Рынок: Ташкент. Менеджер: Асад.

ПРАВИЛА:
1. Обращайся на «ты», по имени.
2. Не пиши воду.
3. Учитывай день и время.
4. Мёртвые — нет активности 5+ дней после КП или 3+ дня после первого касания.
5. Горящие — КП думает или Созвон с позитивным комментарием.
6. Стратегия, не текст сообщений.
7. Мало лидов — скажи прямо.
8. Приоритет: горящие → остывающие → новые.
9. Ставь дедлайны.
10. В конце — одна фраза-мотивация.

ФОРМАТ:
🔴 ГОРЯЧИЕ — закрывай сегодня
🟡 ОСТЫВАЮТ — не дай потерять
🟢 НОВЫЕ — разогревай
⚫ МЁРТВЫЕ — решение
📊 ОБЩАЯ КАРТИНА
💬 [мотивация]

По-русски. Максимум 500 слов.`;

function RopPanel({leads,onClose,groqKey}){
  const [text,setText]=useState('');const [loading,setLoading]=useState(false);const [lastRun,setLastRun]=useState('');
  async function run(){
    if(!leads.length){setText('Асад, канбан пустой — нечего анализировать.');return;}
    setLoading(true);setText('');
    const td=tashDay();
    const ld=leads.map(l=>({name:l.name,stage:STAGES.find(s=>s.id===l.status)?.label||l.status,firstContact:fmtDate(l.firstMsg),lastContact:fmtDate(l.lastMsg),comment:parseComments(l.comments).slice(-1)[0]?.text||'нет комментария'}));
    try{
      const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':`Bearer ${groqKey}`,'Content-Type':'application/json'},body:JSON.stringify({model:'openai/gpt-oss-120b',max_tokens:1200,temperature:0.4,messages:[{role:'system',content:ROP_SYSTEM},{role:'user',content:`Сейчас: ${td.date}, ${td.day}, ${td.hour}:00 по Ташкенту.\n\nКанбан Асада (${leads.length} лидов):\n${JSON.stringify(ld,null,2)}`}]})});
      const d=await res.json();setText(d.choices?.[0]?.message?.content||'Ошибка');setLastRun(td.date);
    }catch(e){setText('Ошибка: '+e.message);}
    setLoading(false);
  }
  useEffect(()=>{if(leads.length>0)run();},[]);
  return(
    <>
      <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(13,27,62,0.25)',zIndex:99,animation:'fadeIn 0.15s ease'}}/>
      <div style={{position:'fixed',right:0,top:0,height:'100vh',width:380,background:'var(--surface)',borderLeft:'1.5px solid var(--border)',zIndex:100,display:'flex',flexDirection:'column',boxShadow:'-8px 0 40px rgba(13,27,62,0.1)'}}>
        <div style={{padding:'16px 18px',borderBottom:'1.5px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--navy)',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,borderRadius:'50%',background:'rgba(255,255,255,0.12)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}><I.rop/></div>
            <div><div style={{fontSize:13,fontWeight:700,color:'#fff'}}>Robert</div><div style={{fontSize:10,color:'rgba(255,255,255,0.4)',fontFamily:'JetBrains Mono,monospace'}}>РОП · AAI Agency</div></div>
          </div>
          <button onClick={onClose} style={{width:28,height:28,background:'rgba(255,255,255,0.1)',border:'none',borderRadius:8,color:'rgba(255,255,255,0.6)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><I.close/></button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'14px 18px'}}>
          {loading&&<div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'3rem',gap:10}}><div style={{width:20,height:20,border:'2px solid var(--border)',borderTopColor:'var(--navy)',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/><div style={{fontSize:12,color:'var(--text3)'}}>Robert анализирует...</div></div>}
          {!loading&&text&&<div style={{fontSize:13,color:'var(--text)',lineHeight:1.9,whiteSpace:'pre-wrap'}}>{text}</div>}
          {!loading&&!text&&<div style={{textAlign:'center',padding:'3rem',color:'var(--text3)',fontSize:13}}>Нажми «Обновить» для анализа</div>}
        </div>
        <div style={{padding:'12px 18px',borderTop:'1.5px solid var(--border)',flexShrink:0}}>
          <button className="btn btn-navy" style={{width:'100%',justifyContent:'center',fontSize:12}} onClick={run} disabled={loading}>
            <span style={{animation:loading?'spin 1s linear infinite':'none',display:'inline-block'}}><I.refresh/></span>{loading?'Анализирую...':'Обновить план'}
          </button>
          {lastRun&&<div style={{fontSize:10,color:'var(--text3)',marginTop:6,textAlign:'center',fontFamily:'JetBrains Mono,monospace'}}>обновлено {lastRun}</div>}
        </div>
      </div>
    </>
  );
}

function App(){
  const [leads,setLeads]=useState(()=>ls(SK)||[]);
  const [page,setPage]=useState('kanban');
  const [selectedLead,setSelectedLead]=useState(null);
  const [newModal,setNewModal]=useState(null);
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState('');
  const [rop,setRop]=useState(false);
  const [groqKey,setGroqKey]=useState('');

  useEffect(()=>{
    fetch(`${API}?action=getKey`).then(r=>r.json()).then(d=>{if(d.key)setGroqKey(d.key);}).catch(()=>{});
  },[]);

  const upd=fn=>setLeads(p=>{const n=fn(p);lss(SK,n);return n;});

  async function loadKanban(){
    setLoading(true);setMsg('Загружаю...');
    try{
      const rows=await apiGet('leads');
      if(!rows||rows.length<2){setMsg('Канбан пуст');setLoading(false);return;}
      const mapped=rows.slice(1).filter(r=>r[0]).map(r=>({
        id:uid(),name:r[0]||'',firstMsg:r[1]||'',status:r[2]||STAGES[0].id,
        lastMsg:r[3]||'',amount:r[4]||'',comments:r[5]||'[]'
      }));
      upd(()=>mapped);setMsg(`${mapped.length} лидов`);
    }catch(e){setMsg('Ошибка: '+e.message);}
    setLoading(false);setTimeout(()=>setMsg(''),3000);
  }

  useEffect(()=>{if(!ls(SK)||ls(SK).length===0)loadKanban();},[]);

  async function saveLead(data,silent){
    const now=tashNow();
    const row=[data.name,data.firstMsg||now,data.status,now,data.amount||'',data.comments||'[]'];
    if(data.id){
      const oldName=leads.find(l=>l.id===data.id)?.name;
      upd(p=>p.map(l=>l.id===data.id?{...l,...data,lastMsg:now}:l));
      setSelectedLead(prev=>prev&&prev.id===data.id?{...prev,...data,lastMsg:now}:prev);
      await apiPost({action:'update',name:oldName||data.name,row,sheet:'leads'});
    }else{
      const nl={...data,id:uid(),lastMsg:now};
      upd(p=>[nl,...p]);
      await apiPost({action:'add',row,sheet:'leads'});
    }
  }

  async function deleteLead(id){
    const lead=leads.find(l=>l.id===id);
    upd(p=>p.filter(l=>l.id!==id));
    if(lead)await apiPost({action:'delete',name:lead.name,sheet:'leads'});
  }

  async function moveLead(id,status){
    const lead=leads.find(l=>l.id===id);if(!lead)return;
    const now=tashNow();
    upd(p=>p.map(l=>l.id===id?{...l,status,lastMsg:now}:l));
    await apiPost({action:'update',name:lead.name,row:[lead.name,lead.firstMsg,status,now,lead.amount||'',lead.comments||'[]'],sheet:'leads'});
  }

  // ✅ ИСПРАВЛЕНО: правильная логика переноса из Pipeline в Kanban
  function sendToKanban(cl,status,comment){
    const now=tashNow();
    
    // Берём firstMessage из All Leads как первый комментарий
    const comments=[];
    if(cl.firstMessage){
      comments.push({id:uid(),text:'📤 Сообщение агента: '+cl.firstMessage,time:now});
    }
    if(comment&&comment.trim()){
      comments.push({id:uid(),text:comment.trim(),time:now});
    }
    
    const newLead={
      id:uid(),
      name:cl.businessName||cl.username,
      firstMsg:now,
      status:status,
      lastMsg:now,
      amount:'',
      comments:JSON.stringify(comments)
    };

    // Мгновенно добавляем локально
    upd(p=>[newLead,...p]);
    
    // Переходим на канбан
    setPage('kanban');
    setMsg(`✅ ${newLead.name} добавлен в канбан`);
    setTimeout(()=>setMsg(''),3000);

    // Пишем в Sheets в фоне
    const row=[newLead.name,newLead.firstMsg,newLead.status,newLead.lastMsg,'',newLead.comments];
    apiPost({action:'add',row,sheet:'leads'}).catch(e=>console.error('Sheets error:',e));
  }

  const total=leads.length;
  const active=leads.filter(l=>l.status!=='Closed'&&l.status!=='Not interested').length;
  const won=leads.filter(l=>l.status==='Closed').length;

  const NAV=[
    {id:'kanban',icon:<I.kanban/>,label:'Канбан'},
    {id:'pipeline',icon:<I.pipe/>,label:'Pipeline'},
    {id:'analytics',icon:<I.chart/>,label:'Аналитика'},
    {id:'goal',icon:<I.goal/>,label:'Цель'},
  ];

  return(
    <div style={{display:'flex',minHeight:'100vh',background:'var(--bg)'}}>
      <aside style={{width:220,flexShrink:0,background:'var(--navy)',display:'flex',flexDirection:'column',height:'100vh',position:'sticky',top:0}}>
        <div style={{padding:'20px 16px 16px',borderBottom:'1px solid rgba(255,255,255,0.07)',display:'flex',justifyContent:'center'}}>
          <img src={LOGO} alt="AAI Agency" style={{width:120,height:40,objectFit:'contain'}}/>
        </div>
        <div style={{padding:'12px 12px 6px'}}>
          <button onClick={()=>setNewModal({status:STAGES[0].id})} style={{width:'100%',padding:'9px 14px',background:'rgba(255,255,255,0.1)',border:'1px solid rgba(255,255,255,0.15)',borderRadius:10,color:'#fff',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:8,cursor:'pointer',fontFamily:'DM Sans,sans-serif',transition:'all 0.15s'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.16)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,0.1)'}><I.plus/>Новый лид</button>
        </div>
        <nav style={{padding:'4px 10px',flex:1}}>
          {NAV.map(n=>(
            <button key={n.id} className={`slink${page===n.id?' act':''}`} onClick={()=>setPage(n.id)}>{n.icon}{n.label}</button>
          ))}
          <div style={{height:1,background:'rgba(255,255,255,0.07)',margin:'7px 4px'}}/>
          <button className={`slink${rop?' act':''}`} onClick={()=>setRop(!rop)}><I.rop/>Robert (РОП)</button>
        </nav>
        <div style={{padding:'10px 12px',borderTop:'1px solid rgba(255,255,255,0.07)'}}>
          <button onClick={loadKanban} disabled={loading} style={{width:'100%',padding:'8px 12px',background:'transparent',border:'1px solid rgba(255,255,255,0.12)',borderRadius:9,color:'rgba(255,255,255,0.5)',fontSize:12,fontWeight:500,display:'flex',alignItems:'center',justifyContent:'center',gap:7,cursor:'pointer',fontFamily:'DM Sans,sans-serif',transition:'all 0.15s'}} onMouseEnter={e=>{e.currentTarget.style.color='#fff';e.currentTarget.style.borderColor='rgba(255,255,255,0.25)';}} onMouseLeave={e=>{e.currentTarget.style.color='rgba(255,255,255,0.5)';e.currentTarget.style.borderColor='rgba(255,255,255,0.12)';}}>
            <span style={{animation:loading?'spin 1s linear infinite':'none',display:'inline-block'}}><I.refresh/></span>
            {loading?'Загружаю...':'Обновить'}
          </button>
          {msg&&<div style={{fontSize:10,color:'rgba(255,255,255,0.3)',marginTop:5,textAlign:'center',fontFamily:'JetBrains Mono,monospace'}}>{msg}</div>}
        </div>
        <div style={{padding:'8px 16px 16px',fontSize:11,color:'rgba(255,255,255,0.25)',lineHeight:2,fontFamily:'JetBrains Mono,monospace'}}>
          <div>{total} лидов · {active} активных</div>
          <div style={{color:'rgba(100,255,160,0.6)',fontWeight:600}}>{won} продаж</div>
        </div>
      </aside>

      <main style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        <div style={{padding:'15px 26px 12px',borderBottom:'1.5px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,background:'var(--surface)',zIndex:10,boxShadow:'0 1px 0 var(--border)'}}>
          <div>
            <h1 style={{fontSize:19,fontWeight:800,letterSpacing:'-0.03em'}}>{NAV.find(n=>n.id===page)?.label||'AAI CRM'}</h1>
            {page==='kanban'&&<p style={{fontSize:11,color:'var(--text3)',marginTop:1,fontFamily:'JetBrains Mono,monospace'}}>{total} лидов · {active} активных · {won} продаж</p>}
          </div>
          <div style={{display:'flex',gap:9}}>
            {page==='kanban'&&<button className="btn btn-navy" style={{fontSize:13}} onClick={()=>setNewModal({status:STAGES[0].id})}><I.plus/>Новый лид</button>}
            <button className="btn" style={rop?{background:'var(--red)',color:'#fff'}:{background:'transparent',color:'var(--text2)',border:'1.5px solid var(--border)'}} onClick={()=>setRop(!rop)}>
              <I.rop/>{rop?'Закрыть':'Robert'}
            </button>
          </div>
        </div>
        <div style={{flex:1,padding:'20px 26px',overflowY:'auto',display:'flex',flexDirection:'column'}}>
          {page==='kanban'&&<KanbanBoard leads={leads} onCardClick={l=>setSelectedLead(l)} onMove={moveLead} onAdd={s=>setNewModal({status:s})}/>}
          {page==='pipeline'&&<PipelinePage onSendToKanban={sendToKanban}/>}
          {page==='analytics'&&<AnalyticsPage leads={leads} groqKey={groqKey}/>}
          {page==='goal'&&<GoalPage/>}
        </div>
        <Wave/>
      </main>

      {selectedLead&&<LeadModal lead={selectedLead} onClose={()=>setSelectedLead(null)} onSave={data=>saveLead({...selectedLead,...data})} onDelete={id=>{deleteLead(id);setSelectedLead(null);}}/>}
      {rop&&<RopPanel leads={leads} groqKey={groqKey} onClose={()=>setRop(false)}/>}
      {newModal&&<NewLeadModal defaultStatus={newModal.status} onSave={data=>saveLead(data)} onClose={()=>setNewModal(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
